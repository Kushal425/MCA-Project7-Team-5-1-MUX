name: FPGA comparison

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fpga-comparison.yml'
      - 'rtl/**'
      - 'synth/run_fpga_ecp5_comparison.sh'

permissions:
  contents: read

jobs:
  ecp5:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: YosysHQ/setup-oss-cad-suite@v4.1.0
        with:
          version: '2026-11-24'
      - name: Synthesize, place and route both cache designs
        run: ./synth/run_fpga_ecp5_comparison.sh "$RUNNER_TEMP/ecp5-results"
      - name: Upload utilization and routed timing evidence
        uses: actions/upload-artifact@v4
        with:
          name: ecp5-fpga-comparison
          path: |
            ${{ runner.temp }}/ecp5-results/versions.txt
            ${{ runner.temp }}/ecp5-results/cache_*/timing.json
            ${{ runner.temp }}/ecp5-results/cache_*/*.log
          if-no-files-found: error
